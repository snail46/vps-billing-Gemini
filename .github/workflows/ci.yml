name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Go Format Check
        run: |
          cd backend
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Please run gofmt."
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Go Test
        run: |
          cd backend
          go test -v -race ./...

      - name: Go Build
        run: |
          cd backend
          go build -v -o /dev/null ./cmd/server
          go build -v -o /dev/null ./cmd/worker

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image repository
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server and worker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/server:latest
            ${{ env.IMAGE_REPO }}/server:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/worker:latest
            ${{ env.IMAGE_REPO }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push user-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/user-web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/user-web:latest
            ${{ env.IMAGE_REPO }}/user-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/admin-web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/admin-web:latest
            ${{ env.IMAGE_REPO }}/admin-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
