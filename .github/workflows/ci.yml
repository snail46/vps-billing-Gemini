name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Go Format Check
        run: |
          cd backend
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Please run gofmt."
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Go Test
        run: |
          cd backend
          go test -v -race ./...

      - name: Go Build
        run: |
          cd backend
          go build -v -o /dev/null ./cmd/server
          go build -v -o /dev/null ./cmd/worker

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker Images Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Images
        run: |
          docker compose build
